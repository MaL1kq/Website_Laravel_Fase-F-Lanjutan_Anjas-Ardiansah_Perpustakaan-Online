<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Buku Favorit - PerpusDigital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <div id="global-header"></div>

    <main class="flex-grow">
        <!-- Banner Title -->
        <div class="bg-indigo-900/5 border-b border-indigo-100 py-8">
            <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-pink-600 text-white flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-heart text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Koleksi Favorit Pribadi</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Daftar buku pilihan yang Anda simpan untuk dibaca atau dibeli di kemudian hari.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16 py-10">
            <div id="fav-books-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
                <!-- Injected by JS -->
            </div>

            <div id="fav-empty" class="hidden bg-white rounded-3xl border border-slate-200/80 p-12 text-center max-w-lg mx-auto shadow-sm">
                <div class="w-20 h-20 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fa-regular fa-heart"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-900">Belum Ada Buku Favorit</h3>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                    Klik ikon hati pada detail buku atau katalog untuk menyimpannya ke koleksi favorit Anda.
                </p>
                <a href="katalog.html" class="inline-flex items-center mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-md shadow-indigo-200 transition">
                    <i class="fa-solid fa-book-open mr-2"></i> Jelajahi Katalog
                </a>
            </div>
        </div>
    </main>

    <div id="global-footer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('favorit');
            renderFooter();
            renderFavorites();

            window.addEventListener('perpus_favorites_changed', renderFavorites);
        });

        function renderFavorites() {
            const user = Store.getCurrentUser();
            const grid = document.getElementById('fav-books-grid');
            const emptyEl = document.getElementById('fav-empty');

            if (!user) {
                grid.innerHTML = '';
                emptyEl.classList.remove('hidden');
                emptyEl.innerHTML = `
                    <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500 text-3xl mx-auto mb-4">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-900">Silakan Masuk Terlebih Dahulu</h3>
                    <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                        Koleksi buku favorit hanya dapat diakses oleh anggota yang telah masuk ke akun.
                    </p>
                    <a href="login.html" class="inline-flex items-center mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-md shadow-indigo-200 transition">
                        <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk ke Akun
                    </a>
                `;
                return;
            }

            const favIds = Store.getFavorites();
            const allBooks = Store.getBooks();
            const books = allBooks.filter(b => favIds.includes(b.id));

            if (books.length === 0) {
                grid.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            grid.innerHTML = books.map(b => `
                <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-200 flex flex-col justify-between group">
                    <div class="relative bg-slate-100 aspect-[3/4] overflow-hidden">
                        <img src="${b.cover}" alt="${b.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute top-2.5 left-2.5">
                            <span class="bg-slate-900/80 backdrop-blur-sm text-white text-[10px] font-semibold px-2 py-0.5 rounded-full">
                                ${b.kategori_nama}
                            </span>
                        </div>
                        <button onclick="Store.toggleFavorite(${b.id})" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-white/90 text-rose-500 flex items-center justify-center shadow transition" title="Hapus dari favorit">
                            <i class="fa-solid fa-heart text-xs"></i>
                        </button>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2 leading-snug group-hover:text-indigo-600 transition">
                                <a href="buku-detail.html?id=${b.id}">${b.judul}</a>
                            </h3>
                            <p class="text-xs text-slate-500 mt-0.5">${b.penulis}</p>
                        </div>
                        <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs font-extrabold text-indigo-600">${Store.formatRupiah(b.harga)}</span>
                            <div class="flex space-x-1.5">
                                <a href="buku-detail.html?id=${b.id}" class="py-1 px-2.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white rounded-lg text-xs font-bold transition">
                                    Lihat
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
