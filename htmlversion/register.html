<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota Baru - PerpusDigital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <!-- Global Header -->
    <div id="global-header"></div>

    <!-- Main Content (Persis Laravel) -->
    <main class="flex-grow flex items-center justify-center py-10 px-4 sm:px-6">
        <div class="max-w-lg w-full">
            <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/80 p-8">
                <!-- Logo & Header -->
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-gradient-to-tr from-indigo-600 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-indigo-200 mb-3">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">Daftar Anggota</h2>
                    <p class="text-sm text-slate-500 mt-1">Buat akun untuk meminjam buku secara online</p>
                </div>

                <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                    <div>
                        <label for="reg-name" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="reg-name" required
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                            placeholder="Contoh: Ahmad Fauzi">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="reg-username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Username</label>
                            <input type="text" id="reg-username" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                                placeholder="ahmad123">
                        </div>
                        <div>
                            <label for="reg-email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email</label>
                            <input type="email" id="reg-email" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                                placeholder="ahmad@gmail.com">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="reg-pass" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Kata Sandi</label>
                            <input type="password" id="reg-pass" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                                placeholder="Min. 6 karakter">
                        </div>
                        <div>
                            <label for="reg-pass-confirm" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Ulangi Sandi</label>
                            <input type="password" id="reg-pass-confirm" required
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                                placeholder="Ulangi kata sandi">
                        </div>
                    </div>

                    <div>
                        <label for="reg-telepon" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">No. WhatsApp / HP</label>
                        <input type="text" id="reg-telepon"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                            placeholder="081234567890">
                    </div>

                    <div>
                        <label for="reg-alamat" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Alamat Rumah</label>
                        <textarea id="reg-alamat" rows="2"
                            class="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition"
                            placeholder="Jl. Melati No. 5..."></textarea>
                    </div>

                    <button type="submit" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-200 transition duration-150 flex items-center justify-center mt-2">
                        <span>Daftar Akun Sekarang</span>
                        <i class="fa-solid fa-user-check ml-2 text-xs"></i>
                    </button>
                </form>

                <p class="text-center text-xs text-slate-500 mt-6">
                    Sudah memiliki akun?
                    <a href="login.html" class="font-bold text-indigo-600 hover:text-indigo-800 transition">Masuk di sini</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Global Footer -->
    <div id="global-footer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('register');
            renderFooter('register');
        });

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const telepon = document.getElementById('reg-telepon').value.trim();
            const alamat = document.getElementById('reg-alamat').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const passConfirm = document.getElementById('reg-pass-confirm').value;

            if (pass !== passConfirm) {
                Store.toast('Konfirmasi kata sandi tidak cocok!', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
            const existing = users.find(u => u.username.toLowerCase() === username.toLowerCase() || u.email.toLowerCase() === email.toLowerCase());
            if (existing) {
                Store.toast('Username atau email sudah digunakan!', 'error');
                return;
            }

            const newUser = {
                id: Date.now(),
                name,
                username,
                email,
                role: 'peminjam',
                alamat,
                no_telepon: telepon
            };

            users.push(newUser);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            Store.setCurrentUser(newUser);

            Store.toast(`Pendaftaran berhasil! Selamat datang, ${name}.`, 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 400);
        }
    </script>
</body>
</html>
