<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Buku Perpustakaan - PerpusDigital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <div id="global-header"></div>

    <main class="flex-grow">
        <!-- Banner Title -->
        <div class="bg-indigo-900/5 border-b border-indigo-100 py-8">
            <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16">
                <div class="flex items-center text-xs text-slate-500 space-x-2 mb-2">
                    <a href="index.html" class="hover:text-indigo-600">Beranda</a>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span class="text-slate-800 font-semibold">Katalog Buku</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Katalog Koleksi Buku</h1>
                <p class="text-sm text-slate-500 mt-1">Temukan berbagai referensi ilmu, novel, materi pembelajaran, dan buku berkualitas siap pinjam & beli.</p>
            </div>
        </div>

        <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 2xl:grid-cols-5 gap-8">
                <!-- Sidebar Filters -->
                <div class="lg:col-span-1 2xl:col-span-1 space-y-6">
                    <!-- Search Widget -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                        <h3 class="font-bold text-slate-900 text-sm uppercase tracking-wider mb-3">Pencarian</h3>
                        <div class="relative">
                            <input type="text" id="katalog-search-input" placeholder="Judul, Penulis, ISBN..."
                                class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
                        </div>
                        <button onclick="applyFilters()" class="w-full mt-2.5 py-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition">
                            Cari Buku
                        </button>
                        <button onclick="resetFilters()" class="w-full text-center mt-2 text-xs text-rose-600 hover:underline">
                            <i class="fa-solid fa-rotate-left mr-1"></i> Reset Filter
                        </button>
                    </div>

                    <!-- Categories Widget -->
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
                        <h3 class="font-bold text-slate-900 text-sm uppercase tracking-wider mb-3">Kategori Buku</h3>
                        <ul id="katalog-categories-list" class="space-y-1.5 text-sm">
                            <!-- Injected by JS -->
                        </ul>
                    </div>
                </div>

                <!-- Main Book List -->
                <div class="lg:col-span-3 2xl:col-span-4 space-y-6">
                    <!-- Filter & Sort Bar -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
                        <p class="text-xs text-slate-500">
                            Menampilkan <span id="katalog-count-showing" class="font-bold text-slate-800">0</span> buku dari total <span id="katalog-count-total" class="font-bold text-slate-800">0</span> koleksi
                        </p>

                        <!-- Sorting Dropdown -->
                        <div class="flex items-center space-x-2 w-full sm:w-auto">
                            <label for="katalog-sort-select" class="text-xs text-slate-500 whitespace-nowrap">Urutkan:</label>
                            <select id="katalog-sort-select" onchange="applyFilters()" class="bg-slate-50 border border-slate-200 text-xs font-semibold rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="latest">Terbaru</option>
                                <option value="popular">Paling Populer (Rating)</option>
                                <option value="price_asc">Harga Terendah</option>
                                <option value="price_desc">Harga Tertinggi</option>
                                <option value="title_asc">Judul (A - Z)</option>
                                <option value="title_desc">Judul (Z - A)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Book Grid -->
                    <div id="katalog-book-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
                        <!-- Rendered by JS -->
                    </div>

                    <div id="katalog-empty-state" class="hidden bg-white rounded-2xl p-12 text-center border border-slate-200/80">
                        <div class="w-16 h-16 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center text-2xl mx-auto mb-3">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base">Buku Tidak Ditemukan</h3>
                        <p class="text-xs text-slate-500 mt-1">Coba gunakan kata kunci lain atau pilih kategori yang berbeda.</p>
                        <button onclick="resetFilters()" class="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                            Tampilkan Semua Buku
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="global-footer"></div>

    <script>
        let currentKategori = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('katalog');
            renderFooter();

            // Read URL params
            const params = new URLSearchParams(window.location.search);
            const queryParam = params.get('q') || '';
            const katParam = params.get('kategori') || '';

            if (queryParam) {
                document.getElementById('katalog-search-input').value = queryParam;
            }
            if (katParam) {
                currentKategori = katParam;
            }

            renderCategoryFilterList();
            applyFilters();

            // Listen to Enter on search input
            document.getElementById('katalog-search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') applyFilters();
            });
        });

        function renderCategoryFilterList() {
            const categories = Store.getCategories();
            const books = Store.getBooks();
            const container = document.getElementById('katalog-categories-list');

            let html = `
                <li>
                    <button onclick="setCategoryFilter('')" class="w-full flex justify-between items-center px-3 py-2 rounded-xl text-left transition ${currentKategori === '' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}">
                        <span>Semua Kategori</span>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">${books.length}</span>
                    </button>
                </li>
            `;

            categories.forEach(cat => {
                const count = books.filter(b => b.kategori_id === cat.id || b.kategori_slug === cat.slug).length;
                const active = currentKategori === cat.slug;
                html += `
                    <li>
                        <button onclick="setCategoryFilter('${cat.slug}')" class="w-full flex justify-between items-center px-3 py-2 rounded-xl text-left transition ${active ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}">
                            <span class="line-clamp-1">${cat.nama_kategori}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">${count}</span>
                        </button>
                    </li>
                `;
            });

            container.innerHTML = html;
        }

        function setCategoryFilter(slug) {
            currentKategori = slug;
            renderCategoryFilterList();
            applyFilters();
        }

        function resetFilters() {
            document.getElementById('katalog-search-input').value = '';
            document.getElementById('katalog-sort-select').value = 'latest';
            currentKategori = '';
            renderCategoryFilterList();
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('katalog-search-input').value.toLowerCase().trim();
            const sortBy = document.getElementById('katalog-sort-select').value;
            let books = Store.getBooks();

            document.getElementById('katalog-count-total').innerText = books.length;

            if (currentKategori) {
                books = books.filter(b => b.kategori_slug === currentKategori || b.kategori_id == currentKategori);
            }

            if (search) {
                books = books.filter(b =>
                    (b.judul && b.judul.toLowerCase().includes(search)) ||
                    (b.penulis && b.penulis.toLowerCase().includes(search)) ||
                    (b.penerbit && b.penerbit.toLowerCase().includes(search)) ||
                    (b.isbn && b.isbn.toLowerCase().includes(search))
                );
            }

            // Sorting
            if (sortBy === 'popular') {
                books.sort((a, b) => b.rating - a.rating);
            } else if (sortBy === 'price_asc') {
                books.sort((a, b) => a.harga - b.harga);
            } else if (sortBy === 'price_desc') {
                books.sort((a, b) => b.harga - a.harga);
            } else if (sortBy === 'title_asc') {
                books.sort((a, b) => a.judul.localeCompare(b.judul));
            } else if (sortBy === 'title_desc') {
                books.sort((a, b) => b.judul.localeCompare(a.judul));
            } else {
                // latest
                books.sort((a, b) => b.id - a.id);
            }

            document.getElementById('katalog-count-showing').innerText = books.length;

            const grid = document.getElementById('katalog-book-grid');
            const empty = document.getElementById('katalog-empty-state');

            if (books.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                grid.innerHTML = books.map(b => `
                    <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-200 flex flex-col justify-between group">
                        <div class="relative bg-slate-100 aspect-[3/4] overflow-hidden">
                            <img src="${b.cover}" alt="${b.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute top-2.5 left-2.5">
                                <span class="bg-slate-900/80 backdrop-blur-sm text-white text-[10px] font-semibold px-2 py-0.5 rounded-full">
                                    ${b.kategori_nama}
                                </span>
                            </div>
                            <button onclick="Store.toggleFavorite(${b.id}); this.classList.toggle('text-rose-500');" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-white/90 text-slate-400 hover:text-rose-500 flex items-center justify-center shadow transition ${Store.isFavorite(b.id) ? 'text-rose-500' : ''}">
                                <i class="fa-solid fa-heart text-xs"></i>
                            </button>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center space-x-1 text-amber-400 text-xs mb-1">
                                    <i class="fa-solid fa-star"></i>
                                    <span class="font-bold text-slate-700 ml-1">${b.rating.toFixed(1)}</span>
                                    <span class="text-slate-400 text-[10px]">(${b.total_ulasan})</span>
                                </div>
                                <h3 class="text-xs sm:text-sm font-bold text-slate-900 line-clamp-2 leading-snug group-hover:text-indigo-600 transition">
                                    <a href="buku-detail.html?id=${b.id}">${b.judul}</a>
                                </h3>
                                <p class="text-xs text-slate-500 mt-0.5">${b.penulis}</p>
                            </div>
                            <div class="mt-3 pt-3 border-t border-slate-100">
                                <div class="flex items-center justify-between mb-2.5">
                                    <span class="text-xs font-extrabold text-indigo-600">${Store.formatRupiah(b.harga)}</span>
                                    <span class="text-[10px] text-slate-500">Stok: <strong>${b.stok}</strong></span>
                                </div>
                                <div class="grid grid-cols-2 gap-1.5">
                                    <a href="buku-detail.html?id=${b.id}" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-center text-xs font-semibold transition">
                                        Detail
                                    </a>
                                    <button onclick="Store.addToCart(${b.id}, 1)" class="py-1.5 px-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-center text-xs font-semibold transition shadow-sm">
                                        + Beli
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
