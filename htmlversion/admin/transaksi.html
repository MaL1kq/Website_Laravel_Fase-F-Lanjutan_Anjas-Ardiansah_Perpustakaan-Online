<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Peminjaman Buku - Panel Administrator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex h-screen overflow-hidden" x-data="{ sidebarOpen: false }">

    <div id="admin-sidebar-container"></div>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="admin-topbar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="space-y-6">
                <div>
                    <h1 class="text-2xl font-black text-slate-900">Kelola Sirkulasi Peminjaman Buku</h1>
                    <p class="text-xs text-slate-500 mt-1">Verifikasi pengajuan pinjam online dari siswa, pemantauan batas waktu, dan konfirmasi pengembalian.</p>
                </div>

                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider text-[11px] border-b border-slate-100">
                                <tr>
                                    <th class="py-4 px-6">ID Pinjam</th>
                                    <th class="py-4 px-6">Peminjam</th>
                                    <th class="py-4 px-6">Buku yang Dipinjam</th>
                                    <th class="py-4 px-6">Tgl Pinjam</th>
                                    <th class="py-4 px-6">Batas Kembali</th>
                                    <th class="py-4 px-6">Denda</th>
                                    <th class="py-4 px-6 text-center">Status</th>
                                    <th class="py-4 px-6 text-center">Aksi Cepat</th>
                                </tr>
                            </thead>
                            <tbody id="transaksi-table-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                                <!-- Injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminSidebar('transaksi');
            renderAdminTopBar('Peminjaman Buku');
            renderTransaksiTable();
        });

        function renderTransaksiTable() {
            const borrowings = Store.getBorrowings();
            const tbody = document.getElementById('transaksi-table-body');

            const statusColors = {
                'menunggu': 'bg-amber-50 text-amber-700 border-amber-200',
                'dipinjam': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                'selesai': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'ditolak': 'bg-rose-50 text-rose-700 border-rose-200'
            };

            tbody.innerHTML = borrowings.map(b => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-4 px-6 font-mono font-bold text-slate-900">#${b.id}</td>
                    <td class="py-4 px-6">
                        <p class="font-bold text-slate-900">${b.user_name}</p>
                        <span class="text-[10px] text-slate-400">Anggota Siswa</span>
                    </td>
                    <td class="py-4 px-6">
                        <div class="flex items-center space-x-3">
                            <img src="${b.cover_buku}" alt="${b.judul_buku}" class="w-8 h-12 object-cover rounded shadow-sm bg-slate-100 flex-shrink-0">
                            <span class="font-bold text-slate-900 line-clamp-1 max-w-xs">${b.judul_buku}</span>
                        </div>
                    </td>
                    <td class="py-4 px-6 text-slate-500">${b.tanggal_peminjaman}</td>
                    <td class="py-4 px-6 font-bold text-rose-600">${b.tanggal_pengembalian}</td>
                    <td class="py-4 px-6 font-bold ${b.denda > 0 ? 'text-rose-600' : 'text-slate-400'}">
                        ${b.denda > 0 ? Store.formatRupiah(b.denda) : 'Rp 0'}
                    </td>
                    <td class="py-4 px-6 text-center">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase border ${statusColors[b.status] || 'bg-slate-100 text-slate-600'}">
                            ${b.status}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div class="flex items-center justify-center space-x-1.5">
                            ${b.status === 'menunggu' ? `
                                <button onclick="setBorrowStatus(${b.id}, 'dipinjam')" class="px-2.5 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 shadow-sm" title="Setujui Pinjaman">
                                    Setujui
                                </button>
                            ` : ''}
                            ${b.status === 'dipinjam' ? `
                                <button onclick="setBorrowStatus(${b.id}, 'selesai')" class="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 shadow-sm" title="Tandai Sudah Dikembalikan">
                                    Kembalikan
                                </button>
                            ` : ''}
                            <a href="../cetak-bukti-pinjam.html?id=${b.id}" target="_blank" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition" title="Cetak Bukti">
                                <i class="fa-solid fa-print"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function setBorrowStatus(id, newStatus) {
            let borrowings = Store.getBorrowings();
            const b = borrowings.find(item => item.id == id);
            if (b) {
                b.status = newStatus;
                if (newStatus === 'selesai') {
                    b.tanggal_dikembalikan = new Date().toISOString().slice(0, 10);
                }
                Store.saveBorrowings(borrowings);
                Store.toast(`Peminjaman #${id} berhasil diubah ke: ${newStatus.toUpperCase()}`, 'success');
                renderTransaksiTable();
            }
        }
    </script>
</body>
</html>
