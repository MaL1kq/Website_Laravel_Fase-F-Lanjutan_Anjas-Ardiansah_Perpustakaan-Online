<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pesanan Masuk - Panel Administrator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex h-screen overflow-hidden" x-data="{ sidebarOpen: false, modalDetail: false, activeOrder: null }">

    <div id="admin-sidebar-container"></div>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="admin-topbar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-black text-slate-900">Daftar Pesanan Buku Masuk</h1>
                        <p class="text-xs text-slate-500 mt-1">
                            Kelola verifikasi pembayaran (Payment at Delivery) dan proses status pengiriman buku pelanggan.
                        </p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider text-[11px] border-b border-slate-100">
                                <tr>
                                    <th class="py-4 px-6">Kode Pesanan</th>
                                    <th class="py-4 px-6">Pembeli & Penerima</th>
                                    <th class="py-4 px-6">Total Tagihan</th>
                                    <th class="py-4 px-6">Metode Pembayaran</th>
                                    <th class="py-4 px-6">Status Pesanan</th>
                                    <th class="py-4 px-6 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                                <!-- Injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal Detail Pesanan Admin -->
            <div x-show="modalDetail" x-cloak class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
                <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
                    <div @click="modalDetail = false" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
                    <div class="inline-block bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-2xl sm:w-full p-6 sm:p-8 relative z-10 border border-slate-100">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Detail Pesanan Toko Buku</span>
                                <h3 class="text-lg font-bold text-slate-900 mt-0.5" x-text="activeOrder ? activeOrder.kode_pesanan : ''"></h3>
                            </div>
                            <button @click="modalDetail = false" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <template x-if="activeOrder">
                            <div class="mt-4 space-y-4">
                                <div class="grid grid-cols-2 gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100 text-xs">
                                    <div>
                                        <span class="text-slate-400 block font-medium">Pembeli / Akun:</span>
                                        <span class="font-bold text-slate-900 mt-0.5 block" x-text="activeOrder.user_name"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block font-medium">Metode Pembayaran:</span>
                                        <span class="font-bold text-slate-900 mt-0.5 block" x-text="activeOrder.metode_pembayaran"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block font-medium">Nama Penerima:</span>
                                        <span class="font-bold text-slate-900 mt-0.5 block" x-text="activeOrder.nama_penerima"></span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block font-medium">No. Telp / WA:</span>
                                        <span class="font-bold text-slate-900 mt-0.5 block font-mono" x-text="activeOrder.no_telepon"></span>
                                    </div>
                                    <div class="col-span-2">
                                        <span class="text-slate-400 block font-medium">Alamat Pengiriman:</span>
                                        <span class="font-bold text-slate-900 mt-0.5 block" x-text="activeOrder.alamat_pengiriman"></span>
                                    </div>
                                    <template x-if="activeOrder.catatan">
                                        <div class="col-span-2">
                                            <span class="text-slate-400 block font-medium">Catatan Pembeli:</span>
                                            <span class="italic text-slate-700 mt-0.5 block" x-text="activeOrder.catatan"></span>
                                        </div>
                                    </template>
                                </div>

                                <div>
                                    <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Item Buku yang Dipesan</h4>
                                    <div class="divide-y divide-slate-100 border border-slate-100 rounded-2xl overflow-hidden">
                                        <template x-for="item in activeOrder.items" :key="item.buku_id">
                                            <div class="p-3 bg-white flex items-center justify-between text-xs">
                                                <div class="flex items-center space-x-3">
                                                    <img :src="item.cover" class="w-10 h-14 object-cover rounded-lg bg-slate-100">
                                                    <div>
                                                        <p class="font-bold text-slate-900" x-text="item.judul"></p>
                                                        <p class="text-slate-500" x-text="`${item.jumlah} x ${Store.formatRupiah(item.harga_satuan)}`"></p>
                                                    </div>
                                                </div>
                                                <span class="font-bold text-slate-900" x-text="Store.formatRupiah(item.subtotal)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <div class="pt-2 flex justify-between items-center border-t border-slate-100">
                                    <div>
                                        <span class="text-xs text-slate-400">Total Tagihan:</span>
                                        <p class="text-lg font-black text-indigo-600" x-text="Store.formatRupiah(activeOrder.total_harga)"></p>
                                    </div>
                                    <div class="flex space-x-2">
                                        <a :href="`../cetak-invoice.html?id=${activeOrder.id}`" target="_blank" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition flex items-center">
                                            <i class="fa-solid fa-print mr-1.5"></i> Cetak Struk
                                        </a>
                                        <button @click="modalDetail = false" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">
                                            Tutup
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminSidebar('pesanan');
            renderAdminTopBar('Kelola Pesanan Masuk');
            renderAdminOrdersTable();
        });

        function renderAdminOrdersTable() {
            const orders = Store.getOrders();
            const tbody = document.getElementById('orders-table-body');

            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-4 px-6 font-mono font-bold text-slate-900">
                        ${o.kode_pesanan}
                        <span class="block text-[10px] text-slate-400 font-sans font-normal mt-0.5">${o.created_at}</span>
                    </td>
                    <td class="py-4 px-6">
                        <p class="font-bold text-slate-900">${o.nama_penerima}</p>
                        <p class="text-[11px] text-slate-500 font-mono mt-0.5">${o.no_telepon}</p>
                    </td>
                    <td class="py-4 px-6 font-mono font-extrabold text-indigo-600">
                        ${Store.formatRupiah(o.total_harga)}
                    </td>
                    <td class="py-4 px-6 text-slate-600 text-[11px]">
                        ${o.metode_pembayaran}
                    </td>
                    <td class="py-4 px-6">
                        <select onchange="changeOrderStatus(${o.id}, this.value)" class="text-xs font-bold rounded-xl px-2.5 py-1.5 border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                            <option value="menunggu" ${o.status === 'menunggu' ? 'selected' : ''}>Menunggu Konfirmasi</option>
                            <option value="diproses" ${o.status === 'diproses' ? 'selected' : ''}>Diproses</option>
                            <option value="dikirim" ${o.status === 'dikirim' ? 'selected' : ''}>Dikirim</option>
                            <option value="selesai" ${o.status === 'selesai' ? 'selected' : ''}>Selesai</option>
                            <option value="dibatalkan" ${o.status === 'dibatalkan' ? 'selected' : ''}>Dibatalkan</option>
                        </select>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="openAdminOrderDetail(${o.id})" class="p-1.5 rounded-lg text-indigo-600 hover:bg-indigo-50 transition" title="Lihat Detail">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <a href="../cetak-invoice.html?id=${o.id}" target="_blank" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 transition" title="Cetak Invoice">
                                <i class="fa-solid fa-print"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function changeOrderStatus(orderId, newStatus) {
            let orders = Store.getOrders();
            const o = orders.find(item => item.id == orderId);
            if (o) {
                o.status = newStatus;
                Store.saveOrders(orders);
                Store.toast(`Status pesanan ${o.kode_pesanan} diubah ke: ${newStatus.toUpperCase()}`, 'success');
            }
        }

        function openAdminOrderDetail(orderId) {
            const o = Store.getOrders().find(item => item.id == orderId);
            if (!o) return;
            const data = Alpine.$data(document.querySelector('[x-data]'));
            data.activeOrder = o;
            data.modalDetail = true;
        }
    </script>
</body>
</html>
