<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kategori Buku - Panel Administrator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex h-screen overflow-hidden" x-data="{ sidebarOpen: false, modalKat: false, isEdit: false, editId: null }">

    <div id="admin-sidebar-container"></div>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="admin-topbar-container"></div>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-black text-slate-900">Kelola Kategori Buku</h1>
                        <p class="text-xs text-slate-500 mt-1">Daftar klasifikasi bidang ilmu dan jenis buku perpustakaan.</p>
                    </div>
                    <button onclick="openCreateModal()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-200 transition flex items-center">
                        <i class="fa-solid fa-plus mr-1.5"></i> Tambah Kategori Baru
                    </button>
                </div>

                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider text-[11px] border-b border-slate-100">
                                <tr>
                                    <th class="py-4 px-6">No</th>
                                    <th class="py-4 px-6">Nama Kategori</th>
                                    <th class="py-4 px-6">Slug</th>
                                    <th class="py-4 px-6">Deskripsi Singkat</th>
                                    <th class="py-4 px-6 text-center">Jumlah Buku</th>
                                    <th class="py-4 px-6 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="kat-table-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                                <!-- Injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal Add/Edit Kategori -->
            <div x-show="modalKat" x-cloak class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
                <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
                    <div @click="modalKat = false" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
                    <div class="inline-block bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-lg sm:w-full p-6 sm:p-8 relative z-10 border border-slate-100">
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <h3 class="text-base font-bold text-slate-900" x-text="isEdit ? 'Edit Kategori Buku' : 'Tambah Kategori Buku Baru'"></h3>
                            <button @click="modalKat = false" class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <form id="form-kat" onsubmit="handleSaveKategori(event)" class="mt-4 space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Nama Kategori</label>
                                <input type="text" id="modal-kat-nama" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500" placeholder="Contoh: Pemrograman & Komputer">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Slug URL</label>
                                <input type="text" id="modal-kat-slug" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500" placeholder="pemrograman-komputer">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Deskripsi</label>
                                <textarea id="modal-kat-desk" rows="3" class="w-full p-3 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500" placeholder="Keterangan singkat kategori..."></textarea>
                            </div>
                            <div class="pt-2 flex justify-end space-x-2">
                                <button type="button" @click="modalKat = false" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600 hover:bg-slate-50">
                                    Batal
                                </button>
                                <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 shadow-md">
                                    Simpan Kategori
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminSidebar('kategori');
            renderAdminTopBar('Kelola Kategori Buku');
            renderKategoriTable();
        });

        function renderKategoriTable() {
            const categories = Store.getCategories();
            const books = Store.getBooks();
            const tbody = document.getElementById('kat-table-body');

            tbody.innerHTML = categories.map((cat, idx) => {
                const count = books.filter(b => b.kategori_id === cat.id || b.kategori_slug === cat.slug).length;
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-4 px-6 text-slate-400 font-mono">${idx + 1}</td>
                        <td class="py-4 px-6 font-bold text-slate-900">${cat.nama_kategori}</td>
                        <td class="py-4 px-6 font-mono text-slate-500">${cat.slug}</td>
                        <td class="py-4 px-6 text-slate-500 max-w-xs truncate">${cat.deskripsi || '-'}</td>
                        <td class="py-4 px-6 text-center">
                            <span class="px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 font-bold">${count} Buku</span>
                        </td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex items-center justify-center space-x-2">
                                <button onclick="openEditModal(${cat.id})" class="p-1.5 rounded-lg text-indigo-600 hover:bg-indigo-50 transition" title="Edit">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="deleteKategori(${cat.id})" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50 transition" title="Hapus">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openCreateModal() {
            const data = Alpine.$data(document.querySelector('[x-data]'));
            data.isEdit = false;
            data.editId = null;
            document.getElementById('modal-kat-nama').value = '';
            document.getElementById('modal-kat-slug').value = '';
            document.getElementById('modal-kat-desk').value = '';
            data.modalKat = true;
        }

        function openEditModal(id) {
            const cat = Store.getCategories().find(c => c.id == id);
            if (!cat) return;
            const data = Alpine.$data(document.querySelector('[x-data]'));
            data.isEdit = true;
            data.editId = id;
            document.getElementById('modal-kat-nama').value = cat.nama_kategori;
            document.getElementById('modal-kat-slug').value = cat.slug;
            document.getElementById('modal-kat-desk').value = cat.deskripsi || '';
            data.modalKat = true;
        }

        function handleSaveKategori(e) {
            e.preventDefault();
            const data = Alpine.$data(document.querySelector('[x-data]'));
            const nama = document.getElementById('modal-kat-nama').value.trim();
            const slug = document.getElementById('modal-kat-slug').value.trim();
            const desk = document.getElementById('modal-kat-desk').value.trim();

            let categories = Store.getCategories();

            // Cek duplikasi nama kategori
            const existingName = categories.find(c =>
                c.nama_kategori.trim().toLowerCase() === nama.toLowerCase() &&
                (!data.isEdit || c.id != data.editId)
            );
            if (existingName) {
                Store.toast(`Kategori "${nama}" sudah terdaftar! Tidak boleh membuat kategori duplikat.`, 'error');
                return;
            }

            // Cek duplikasi slug
            const existingSlug = categories.find(c =>
                c.slug.trim().toLowerCase() === slug.toLowerCase() &&
                (!data.isEdit || c.id != data.editId)
            );
            if (existingSlug) {
                Store.toast(`Slug "${slug}" sudah digunakan oleh kategori lain!`, 'error');
                return;
            }

            if (data.isEdit) {
                const target = categories.find(c => c.id == data.editId);
                if (target) {
                    target.nama_kategori = nama;
                    target.slug = slug;
                    target.deskripsi = desk;
                }
                Store.toast('Kategori berhasil diperbarui!', 'success');
            } else {
                categories.push({
                    id: Date.now(),
                    nama_kategori: nama,
                    slug: slug,
                    deskripsi: desk,
                    icon: 'fa-book'
                });
                Store.toast('Kategori baru berhasil ditambahkan!', 'success');
            }

            Store.saveCategories(categories);
            data.modalKat = false;
            renderKategoriTable();
        }

        function deleteKategori(id) {
            if (confirm('Hapus kategori ini? Buku yang termasuk dalam kategori ini tidak akan terhapus.')) {
                let categories = Store.getCategories().filter(c => c.id != id);
                Store.saveCategories(categories);
                Store.toast('Kategori berhasil dihapus.', 'info');
                renderKategoriTable();
            }
        }
    </script>
</body>
</html>
