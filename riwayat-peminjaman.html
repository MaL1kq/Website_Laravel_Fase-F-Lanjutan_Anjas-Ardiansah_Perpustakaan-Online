<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Peminjaman Buku - PerpusDigital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/layout.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <div id="global-header"></div>

    <main class="flex-grow">
        <!-- Banner Title -->
        <div class="bg-indigo-900/5 border-b border-indigo-100 py-8">
            <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Riwayat Peminjaman Buku</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Daftar buku yang sedang Anda pinjam maupun yang telah selesai dikembalikan.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-[1700px] mx-auto px-4 sm:px-8 lg:px-12 2xl:px-16 py-10">
            <div id="borrowings-list-container" class="space-y-4">
                <!-- Rendered by JS -->
            </div>

            <div id="borrowings-empty" class="hidden bg-white rounded-3xl border border-slate-200/80 p-12 text-center max-w-lg mx-auto shadow-sm">
                <div class="w-20 h-20 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-3xl mx-auto mb-4">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-900">Belum Ada Riwayat Peminjaman</h3>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                    Anda belum pernah meminjam buku. Ajukan peminjaman buku favorit Anda dengan mudah melalui katalog!
                </p>
                <a href="katalog.html" class="inline-flex items-center mt-6 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-md shadow-indigo-200 transition">
                    <i class="fa-solid fa-book-open mr-2"></i> Cari Buku Sekarang
                </a>
            </div>
        </div>
    </main>

    <div id="global-footer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader('pinjam');
            renderFooter();
            renderBorrowings();

            window.addEventListener('perpus_borrowings_changed', renderBorrowings);
        });

        function renderBorrowings() {
            const container = document.getElementById('borrowings-list-container');
            const emptyEl = document.getElementById('borrowings-empty');
            const borrowings = Store.getBorrowings();

            if (borrowings.length === 0) {
                container.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');

            const statusColors = {
                'menunggu': 'bg-amber-50 text-amber-700 border-amber-200',
                'dipinjam': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                'selesai': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                'ditolak': 'bg-rose-50 text-rose-700 border-rose-200'
            };

            const statusLabels = {
                'menunggu': 'Menunggu Persetujuan Admin',
                'dipinjam': 'Sedang Dipinjam',
                'selesai': 'Telah Dikembalikan',
                'ditolak': 'Ditolak'
            };

            container.innerHTML = borrowings.map(b => `
                <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm hover:shadow-md transition">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="font-mono text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-lg">
                                PINJAM #${b.id}
                            </span>
                            <span class="text-xs text-slate-400">
                                <i class="fa-regular fa-calendar mr-1"></i> Pinjam: ${b.tanggal_peminjaman}
                            </span>
                        </div>
                        <div>
                            <span class="text-xs font-bold px-3 py-1 rounded-full border ${statusColors[b.status] || 'bg-slate-100 text-slate-700'}">
                                ${statusLabels[b.status] || b.status}
                            </span>
                        </div>
                    </div>

                    <div class="py-4 flex items-center justify-between gap-4">
                        <div class="flex items-center space-x-4">
                            <img src="${b.cover_buku}" alt="${b.judul_buku}" class="w-14 h-20 object-cover rounded-xl shadow-sm flex-shrink-0 bg-slate-100">
                            <div>
                                <h3 class="text-sm sm:text-base font-bold text-slate-900">${b.judul_buku}</h3>
                                <p class="text-xs text-slate-500 mt-1">Batas Pengembalian: <span class="font-bold text-rose-600">${b.tanggal_pengembalian}</span></p>
                                ${b.catatan ? `<p class="text-[11px] text-slate-400 mt-1 italic">"${b.catatan}"</p>` : ''}
                            </div>
                        </div>

                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block">Denda Keterlambatan:</span>
                            <span class="text-xs font-bold ${b.denda > 0 ? 'text-rose-600' : 'text-emerald-600'}">
                                ${b.denda > 0 ? Store.formatRupiah(b.denda) : 'Rp 0 (Tepat Waktu)'}
                            </span>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
                        <span class="text-slate-400">Peminjam: <strong class="text-slate-700">${b.user_name}</strong></span>
                        <a href="cetak-bukti-pinjam.html?id=${b.id}" target="_blank" class="px-3.5 py-1.5 border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-lg transition flex items-center">
                            <i class="fa-solid fa-print mr-1.5 text-xs"></i> Cetak Bukti Pinjam
                        </a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
